    // LIVE DRIVER GPS MAP TRACKING COMPONENT

    function LiveDriverMapModal({ isOpen, onClose }) {
      const canvasRef = useRef(null);
      const [driverProgress, setDriverProgress] = useState(0.42); // 0 to 1
      const [telemetry, setTelemetry] = useState({
        etaMins: 14,
        distanceKm: 2.3,
        speedKmh: 42,
        currentStreet: 'Tech Corridor Expressway'
      });

      useEffect(() => {
        if (!isOpen) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        // Path coordinates across the simulated map
        const waypoints = [
          { x: 50, y: 320 },
          { x: 120, y: 260 },
          { x: 220, y: 280 },
          { x: 300, y: 160 },
          { x: 420, y: 180 },
          { x: 500, y: 90 },
          { x: 620, y: 110 }
        ];

        let progress = 0.42;

        const renderMap = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // 1. Dark Cyber Map Grid
          ctx.strokeStyle = '#131b2e';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          }
          for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
          }

          // 2. Simulated city blocks
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(70, 60, 90, 80);
          ctx.fillRect(200, 60, 70, 70);
          ctx.fillRect(350, 40, 110, 80);
          ctx.fillRect(80, 180, 80, 60);
          ctx.fillRect(240, 210, 100, 90);
          ctx.fillRect(390, 220, 120, 80);

          // 3. Planned Route (Dotted Background)
          ctx.beginPath();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          waypoints.forEach((pt, i) => {
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.stroke();

          // 4. Traveled Route (Glowing Emerald)
          const totalPoints = waypoints.length - 1;
          const currentIndex = Math.floor(progress * totalPoints);
          const segmentProgress = (progress * totalPoints) - currentIndex;

          ctx.beginPath();
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 6;
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 10;
          for (let i = 0; i <= currentIndex; i++) {
            if (i === 0) ctx.moveTo(waypoints[i].x, waypoints[i].y);
            else ctx.lineTo(waypoints[i].x, waypoints[i].y);
          }
          const p1 = waypoints[currentIndex];
          const p2 = waypoints[Math.min(currentIndex + 1, waypoints.length - 1)];
          const currentX = p1.x + (p2.x - p1.x) * segmentProgress;
          const currentY = p1.y + (p2.y - p1.y) * segmentProgress;
          ctx.lineTo(currentX, currentY);
          ctx.stroke();
          ctx.shadowBlur = 0; // reset

          // 5. Origin Warehouse Marker
          ctx.fillStyle = '#64748b';
          ctx.beginPath(); ctx.arc(waypoints[0].x, waypoints[0].y, 8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#94a3b8';
          ctx.font = '10px sans-serif';
          ctx.fillText('Central Hub', waypoints[0].x - 20, waypoints[0].y + 20);

          // 6. Destination Home Marker
          const last = waypoints[waypoints.length - 1];
          ctx.fillStyle = '#ef4444';
          ctx.beginPath(); ctx.arc(last.x, last.y, 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f87171';
          ctx.fillText('Your Address', last.x - 25, last.y - 14);

          // 7. Driver Vehicle Moving Marker
          ctx.fillStyle = '#10b981';
          ctx.beginPath(); ctx.arc(currentX, currentY, 12, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText('VAN', currentX - 9, currentY + 3);

          // Pulse ring around vehicle
          const pulse = (Date.now() % 1500) / 1500;
          ctx.strokeStyle = `rgba(16, 185, 129, ${1 - pulse})`;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(currentX, currentY, 12 + pulse * 18, 0, Math.PI * 2); ctx.stroke();

          // Slowly advance progress
          progress = (progress + 0.0003);
          if (progress > 0.95) progress = 0.2;
          setDriverProgress(progress);

          animationFrameId = requestAnimationFrame(renderMap);
        };

        renderMap();
        return () => cancelAnimationFrame(animationFrameId);
      }, [isOpen]);

      if (!isOpen) return null;

      return (

                <div className="text-gray-400 text-[10px] uppercase font-bold">Estimated Arrival</div>

              </div>
            </div>

            {/* Driver & Order Details Footer */}
            <div className="p-5 bg-gray-900 border-t border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <img

    // ----------------------------------------------------------------------
    // 3D PRODUCT VIEWER COMPONENT (Three.js WebGL)
    // ----------------------------------------------------------------------
    function ThreeDProductViewer({ product, onClose }) {
      const mountRef = useRef(null);
      const [selectedColor, setSelectedColor] = useState(product.modelColor || 0x10b981);

      useEffect(() => {
        const width = mountRef.current.clientWidth;
        const height = mountRef.current.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        mountRef.current.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const group = new THREE.Group();
        const mainMaterial = new THREE.MeshStandardMaterial({
          color: selectedColor,
          metalness: 0.85,
          roughness: 0.25
        });

        // 3D Chassis Core
        const coreGeo = new THREE.TorusGeometry(1.6, 0.35, 32, 100);
        const coreMesh = new THREE.Mesh(coreGeo, mainMaterial);
        group.add(coreMesh);

        // Rotating Ring
        const ringGeo = new THREE.RingGeometry(2.3, 2.38, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        group.add(ringMesh);

        scene.add(group);

        let isDragging = false;
        let prevPos = { x: 0, y: 0 };
        const domEl = renderer.domElement;

        const onDown = (e) => { isDragging = true; prevPos = { x: e.clientX, y: e.clientY }; };
        const onMove = (e) => {
          if (!isDragging) return;
          group.rotation.y += (e.clientX - prevPos.x) * 0.008;
          group.rotation.x += (e.clientY - prevPos.y) * 0.008;
          prevPos = { x: e.clientX, y: e.clientY };
        };
        const onUp = () => { isDragging = false; };

        domEl.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isDragging) group.rotation.y += 0.01;
          ringMesh.rotation.z += 0.02;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          domEl.removeEventListener('mousedown', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          if (mountRef.current && domEl) mountRef.current.removeChild(domEl);
        };
      }, [product, selectedColor]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-fade-in">
          <div className="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-4xl overflow-hidden relative shadow-2xl flex flex-col md:flex-row">
            <button onClick={onClose} className="absolute top-4 right-4 z-20 p-2.5 bg-gray-950/80 hover:bg-gray-800 text-gray-300 hover:text-white rounded-full transition">
              <Icons.X />
            </button>
            <div className="w-full md:w-2/3 h-[420px] md:h-[500px] relative bg-gray-950">
              <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
              <div className="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-gray-800 text-[11px] text-gray-300">
                Drag to Rotate 360°
              </div>
            </div>
            <div className="w-full md:w-1/3 p-6 flex flex-col justify-between border-t md:border-t-0 md:border-l border-gray-800 bg-gray-900">
              <div>
                <h3 className="text-lg font-extrabold text-white mb-2">{product.name}</h3>
                <p className="text-xs text-gray-400 mb-6">{product.description}</p>
                <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider block mb-2">Select Finish</span>
                <div className="flex gap-2 mb-6">
                  {[
                    { hex: 0x10b981, bg: 'bg-emerald-500' },
                    { hex: 0x3b82f6, bg: 'bg-blue-500' },
                    { hex: 0xec4899, bg: 'bg-pink-500' },
                    { hex: 0xf59e0b, bg: 'bg-amber-500' },
                  ].map(c => (
                    <button
                      key={c.hex}
                      onClick={() => setSelectedColor(c.hex)}
                      className={`w-7 h-7 rounded-full ${c.bg} transition ${selectedColor === c.hex ? 'ring-2 ring-white scale-110' : 'opacity-70'}`}
                    />
                  ))}
                </div>
              </div>
              <button onClick={onClose} className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xs rounded-xl">
                Close 3D View
              </button>
            </div>
          </div>
        </div>
      );
    }

      const [cart, setCart] = useState([]);
      const [wishlist, setWishlist] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [active3DProduct, setActive3DProduct] = useState(null);
      const [isDriverMapOpen, setIsDriverMapOpen] = useState(false);
      const [isAccountOpen, setIsAccountOpen] = useState(false);

      // User session & auth gating
      const [user, setUser] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authNotice, setAuthNotice] = useState('');

      // Chatbot state
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [messages, setMessages] = useState([
        {
          id: '1',
          sender: 'bot',
          text: "👋 Hi! I'm **NovaAssistant**. I can recommend gear, compare specs, or track your live driver delivery. Ask me anything!",
          recommendedIds: ['prod-1', 'prod-4']
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isBotThinking, setIsBotThinking] = useState(false);

      // Require Login for Cart
      const handleAddToCart = (product) => {
        if (!user) {
          setAuthNotice("Please sign in to add items to your shopping cart!");
          setIsAuthOpen(true);
          return;
        }
        setCart(prev => {
          const found = prev.find(i => i.id === product.id);
          if (found) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...product, qty: 1 }];
        });
      };

      // Require Login for Wishlist
      const handleToggleWishlist = (product) => {
        if (!user) {
          setAuthNotice("Please sign in to save items to your personal wishlist!");
          setIsAuthOpen(true);
          return;
        }
        setWishlist(prev => {
          const exists = prev.some(i => i.id === product.id);
          return exists ? prev.filter(i => i.id !== product.id) : [...prev, product];
        });
      };

      // Intelligent Chatbot
      const askChatbot = (query) => {
        const text = query.trim();
        if (!text) return;

        setMessages(prev => [...prev, { id: Date.now(), sender: 'user', text }]);
        setIsBotThinking(true);

        setTimeout(() => {
          const q = text.toLowerCase();
          let reply = "Here are our recommendations based on your query:";
          let recs = ['prod-1'];
          let showTrackButton = false;

          if (q.includes('driver') || q.includes('track') || q.includes('status') || q.includes('where')) {
            if (user) {
              reply = "Your order **#ORD-9842** is currently out for delivery with **Marcus Vance**! Current ETA is approximately **14 minutes**. You can track the driver on the live GPS map below:";
              showTrackButton = true;
              recs = [];
            } else {
              reply = "Please sign in to view your live driver GPS map and tracking telemetry!";
              recs = [];
            }
          } else if (q.includes('headphone') || q.includes('audio') || q.includes('sound')) {
            reply = "The **NovaPulse Cyber ANC Headphones** ($249.99) feature titanium acoustic drivers, spatial audio, and 55h battery. Click '3D Review' to inspect them in 360°!";
            recs = ['prod-1'];
          } else if (q.includes('game') || q.includes('keyboard')) {
            reply = "The **LuminaKey Mechanical Keyboard** ($139.50) is hot-swappable with gasket mounting and RGB illumination.";
            recs = ['prod-4'];
          } else if (q.includes('chair') || q.includes('ergonomic')) {
            reply = "The **AeroGlide Ultra Ergonomic Chair** ($389.00) features adaptive 3D lumbar support and breathable mesh.";
            recs = ['prod-2'];
          } else if (q.includes('discount') || q.includes('code') || q.includes('coupon')) {
            reply = "Use coupon **NOVA20** during checkout for an immediate **20% off** your order!";
            recs = [];
          }

          setMessages(prev => [
            ...prev,
            { id: Date.now() + 1, sender: 'bot', text: reply, recommendedIds: recs, showTrackButton }
          ]);
          setIsBotThinking(false);
        }, 500);
      };

      const filtered = PRODUCTS.filter(p => {
        const matchesCat = category === 'All' || p.category === category;
        const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase());
        const matchesPrice = p.price <= maxPrice;
        return matchesCat && matchesSearch && matchesPrice;
      });

                              <button
                                onClick={() => handleAddToCart(p)}
                                className="p-1.5 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500 hover:text-black rounded-lg transition"
                                title="Add to Cart"
                              >
                                <Icons.ShoppingBag />
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                ))}
                {isBotThinking && <div className="text-emerald-400 text-xs animate-pulse">NovaAssistant is formulating reply...</div>}
              </div>

              {/* Chat Input */}
              <form
                onSubmit={(e) => { e.preventDefault(); askChatbot(chatInput); setChatInput(''); }}
                className="p-3 bg-gray-850 border-t border-gray-750 flex items-center gap-2"
              >
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  placeholder="Ask 'Where is my driver?' or 'Recommend headphones'..."
                  className="flex-1 bg-gray-950 border border-gray-700 text-white rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-emerald-500"
                />
                <button type="submit" className="p-2.5 bg-emerald-500 hover:bg-emerald-600 text-black rounded-xl font-bold">
                  <Icons.Send />
                </button>
              </form>
            </div>
          )}

          {/* Modals */}
          {active3DProduct && <ThreeDProductViewer product={active3DProduct} onClose={() => setActive3DProduct(null)} />}
          <LiveDriverMapModal isOpen={isDriverMapOpen} onClose={() => setIsDriverMapOpen(false)} />
          <AuthModal isOpen={isAuthOpen} onClose={() => setIsAuthOpen(false)} notice={authNotice} onLogin={(userData) => setUser(userData)} />
          <AccountModal
            isOpen={isAccountOpen}
            onClose={() => setIsAccountOpen(false)}
            user={user}
            onLogout={() => { setUser(null); setCart([]); setWishlist([]); }}
            onOpenMap={() => setIsDriverMapOpen(true)}
            wishlist={wishlist}
            onAddToCart={handleAddToCart}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
